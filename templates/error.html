{% extends "base.html" %}

{% block title %}Study Aid — Something went wrong{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 text-center">
  <h1 class="text-2xl font-bold text-gray-900 mb-3">Something went wrong</h1>
  <p class="text-gray-500 mb-8">{{ message }}</p>
  <a href="/"
    class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition-colors">
    Try again
  </a>
</div>
{% endblock %}
