{% extends "base.html" %}

{% block title %}Study Aid — Upload Material{% endblock %}

{% block content %}
<div class="text-center mb-10">
  <h1 class="text-3xl font-bold text-gray-900 mb-2">Build a quiz from your study material</h1>
  <p class="text-gray-500">Upload a PDF or Word doc, or paste text directly. Claude will generate a personalised quiz.</p>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
  <form action="/ingest" method="post" enctype="multipart/form-data" class="space-y-6">

    <!-- File upload -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Upload a file</label>
      <div class="flex items-center justify-center w-full">
        <label class="flex flex-col items-center justify-center w-full h-36 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer hover:border-indigo-400 hover:bg-indigo-50 transition-colors">
          <svg class="w-8 h-8 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
          </svg>
          <span class="text-sm text-gray-500">Click to upload <span class="font-medium text-indigo-600">.pdf</span> or <span class="font-medium text-indigo-600">.docx</span></span>
          <input type="file" name="file" accept=".pdf,.docx" class="hidden" />
        </label>
      </div>
    </div>

    <div class="flex items-center gap-3 text-sm text-gray-400">
      <div class="flex-1 border-t border-gray-200"></div>
      <span>or paste text</span>
      <div class="flex-1 border-t border-gray-200"></div>
    </div>

    <!-- Paste textarea -->
    <div>
      <label for="text" class="block text-sm font-medium text-gray-700 mb-2">Paste your text</label>
      <textarea id="text" name="text" rows="8"
        placeholder="Paste your study notes, article, or any text you want to be quizzed on…"
        class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none"></textarea>
    </div>

    <button type="submit"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition-colors">
      Generate Quiz
    </button>

  </form>
</div>
{% endblock %}
