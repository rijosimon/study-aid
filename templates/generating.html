{% extends "base.html" %}

{% block title %}Study Aid — Building your quiz{% endblock %}

{% block content %}
<div class="text-center py-24"
     hx-post="/generate/{{ session_id }}"
     hx-trigger="load, every 2s"
     hx-swap="none">
  <svg class="animate-spin h-10 w-10 text-indigo-600 mx-auto mb-6" viewBox="0 0 24 24" fill="none">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
  </svg>
  <p class="text-gray-500 text-lg">Building your quiz…</p>
</div>
{% endblock %}
